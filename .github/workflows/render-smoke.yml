name: Render smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libglu1-mesa \
            libpango1.0-dev \
            pkg-config \
            texlive-science \
            texlive-fonts-extra \
            texlive-latex-extra

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          manimgl --version || true

      - name: Compile-check scenes
        run: python -m compileall -q scenes

      - name: Render all initial scenes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euxo pipefail
          xvfb-run -a manimgl scenes/01_lorentz_boost.py LorentzBoost -w
          xvfb-run -a manimgl scenes/02_proper_time.py ProperTime -w
          xvfb-run -a manimgl scenes/03_four_velocity.py FourVelocity -w
          xvfb-run -a manimgl scenes/04_four_momentum.py FourMomentum -w
          xvfb-run -a manimgl scenes/05_mass_energy_relation.py MassEnergyRelation -w
